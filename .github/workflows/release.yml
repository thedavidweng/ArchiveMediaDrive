name: Release

on:
  push:
    tags:
      - 'kodi-v*'
      - 'jellyfin-v*'
      - 'emby-v*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      platform: ${{ steps.versions.outputs.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Validate tag and version
        id: versions
        run: python3 tools/release/validate_version.py "$GITHUB_REF_NAME"

      - name: Restore and test
        run: |
          dotnet restore --locked-mode ArchiveMediaDrive.sln
          dotnet format --verify-no-changes
          dotnet test ArchiveMediaDrive.sln --configuration Release

      - name: Install rclone
        run: |
          curl --fail --location --output "$RUNNER_TEMP/rclone-v1.75.2-linux-amd64.zip" https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-linux-amd64.zip
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  $RUNNER_TEMP/rclone-v1.75.2-linux-amd64.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/rclone-v1.75.2-linux-amd64.zip" -d "$RUNNER_TEMP/rclone"
          sudo install "$RUNNER_TEMP/rclone/rclone-v1.75.2-linux-amd64/rclone" /usr/local/bin/rclone

        shell: bash
      - name: Host integration tests
        run: |
          dotnet test shared/dotnet/ArchiveMediaDrive.Core.Tests/ArchiveMediaDrive.Core.Tests.csproj --configuration Release --filter "Category=Integration"

      - name: Build package
        id: build
        env:
          ARTIFACT_NAME: ${{ steps.versions.outputs.artifact_name }}
          PLATFORM: ${{ steps.versions.outputs.platform }}
          REPO_BASE_URL: https://raw.githubusercontent.com/thedavidweng/ArchiveMediaDrive/kodi-repo/
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          mkdir -p dist
          case "$PLATFORM" in
            kodi)
              cd plugins/kodi
              python3 build_vendor.py
              python3 test_vendor_smoke.py
              python3 package_release.py
              cd ../..
              cp "plugins/kodi/repo/plugin.video.archivemediadrive/plugin.video.archivemediadrive-$VERSION.zip" "dist/$ARTIFACT_NAME-$GITHUB_REF_NAME.zip"
              cp "plugins/kodi/repo/repository.archivemediadrive/repository.archivemediadrive-$VERSION.zip" "dist/${ARTIFACT_NAME}Repo-$GITHUB_REF_NAME.zip"
              cp "plugins/kodi/repo/addons.xml" "dist/$ARTIFACT_NAME-$GITHUB_REF_NAME-addons.xml"
              cp "plugins/kodi/repo/addons.xml.md5" "dist/$ARTIFACT_NAME-$GITHUB_REF_NAME-addons.xml.md5"
              ;;
            jellyfin)
              dotnet publish plugins/jellyfin/ArchiveMediaDrive.Jellyfin/ArchiveMediaDrive.Jellyfin.csproj -c Release -o ./artifacts/jellyfin
              mkdir -p ./artifacts/jellyfin/runtime/rclone
              cp runtime/rclone/manifest.json ./artifacts/jellyfin/runtime/rclone/manifest.json
              rm -f ./artifacts/jellyfin/*.pdb ./artifacts/jellyfin/*.xml
              rm -f ./artifacts/jellyfin/ArchiveMediaDrive.Jellyfin.deps.json
              rm -f ./artifacts/jellyfin/ArchiveMediaDrive.Jellyfin.runtimeconfig.json
              rm -f ./artifacts/jellyfin/web.config
              rm -f ./artifacts/jellyfin/Jellyfin.*.dll
              rm -f ./artifacts/jellyfin/MediaBrowser.*.dll
              cp LICENSE ./artifacts/jellyfin/LICENSE
              cp NOTICE ./artifacts/jellyfin/NOTICE
              cd ./artifacts/jellyfin
              zip -r "../../dist/$ARTIFACT_NAME-$GITHUB_REF_NAME.zip" .
              cd ../..

              python3 tools/release/update_jellyfin_manifest.py \
                "$GITHUB_REF_NAME" \
                "dist/$ARTIFACT_NAME-$GITHUB_REF_NAME.zip" \
                "plugins/jellyfin/manifest.json" \
                "dist/ArchiveMediaDrive.Jellyfin-$GITHUB_REF_NAME.manifest.json"
              ;;
            emby)
              dotnet publish plugins/emby/ArchiveMediaDrive.Emby/ArchiveMediaDrive.Emby.csproj -c Release -o ./artifacts/emby
              mkdir -p ./artifacts/emby/runtime/rclone
              cp runtime/rclone/manifest.json ./artifacts/emby/runtime/rclone/manifest.json
              rm -f ./artifacts/emby/*.pdb ./artifacts/emby/*.xml
              rm -f ./artifacts/emby/ArchiveMediaDrive.Emby.deps.json
              rm -f ./artifacts/emby/Emby.*.dll
              rm -f ./artifacts/emby/MediaBrowser.*.dll
              cp LICENSE ./artifacts/emby/LICENSE
              cp NOTICE ./artifacts/emby/NOTICE
              cd ./artifacts/emby
              zip -r "../../dist/$ARTIFACT_NAME-$GITHUB_REF_NAME.zip" .
              cd ../..
              ;;
          esac

      - name: Artifact smoke tests
        env:
          PLATFORM: ${{ steps.versions.outputs.platform }}
        run: |
          case "$PLATFORM" in
            kodi)
              python3 -c "import zipfile, sys, os; z=zipfile.ZipFile('dist/ArchiveMediaDrive.Kodi-'+os.environ['GITHUB_REF_NAME']+'.zip'); bad=[n for n in z.namelist() if n.endswith(('.so','.dll','.exe','.pyd','.dylib'))]; sys.exit(1 if bad else 0)"
              ;;
            jellyfin)
              if unzip -Z1 "dist/ArchiveMediaDrive.Jellyfin-$GITHUB_REF_NAME.zip" | grep -qE '^(Jellyfin\.|MediaBrowser\.).*\.dll$'; then exit 1; fi
              ;;
            emby)
              if unzip -Z1 "dist/ArchiveMediaDrive.Emby-$GITHUB_REF_NAME.zip" | grep -qE '^(Emby\.|MediaBrowser\.).*\.dll$'; then exit 1; fi
              ;;
          esac

      - name: Reject forbidden files and placeholders
        env:
          PLATFORM: ${{ steps.versions.outputs.platform }}
        run: |
          if [ "$PLATFORM" = "kodi" ]; then
            if find plugins/kodi/repo -type f \( -name '*.so' -o -name '*.dll' -o -name '*.exe' \) | grep -q .; then
              exit 1
            fi
          fi
          if grep -R "REPLACE_FROM_OFFICIAL_SHA256SUMS" runtime artifacts 2>/dev/null; then exit 1; fi

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ steps.versions.outputs.platform == 'kodi' && './plugins/kodi/plugin.video.archivemediadrive' || format('./artifacts/{0}', steps.versions.outputs.platform) }}
          format: cyclonedx-json
          output-file: ./dist/${{ steps.versions.outputs.artifact_name }}-${{ github.ref_name }}.sbom.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: Upload kodi repository artifact
        if: steps.versions.outputs.platform == 'kodi'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kodi-repo-${{ github.ref_name }}
          path: plugins/kodi/repo/
          if-no-files-found: error

  release:
    timeout-minutes: 60
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist-${{ github.ref_name }}
          path: dist/

      - name: Download kodi repository
        if: needs.build.outputs.platform == 'kodi'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kodi-repo-${{ github.ref_name }}
          path: kodi-repo/

      - name: Generate SHA-256 checksums
        run: python3 tools/release/generate_checksums.py

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        # v3.0.3 retained for coordinated uploads/release metadata; no shell execution.
        # v3.0.3; required create/update release semantics.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # zizmor: ignore[superfluous-actions]
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish Kodi repository branch
        if: needs.build.outputs.platform == 'kodi'
        run: |
          cd kodi-repo
          git init
          git checkout -b kodi-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -m "Publish Kodi repository for ${GITHUB_REF_NAME}"
          git push --force origin kodi-repo

      - name: Publish Jellyfin repository branch
        if: needs.build.outputs.platform == 'jellyfin'
        run: |
          mkdir -p jellyfin-repo
          cp "dist/ArchiveMediaDrive.Jellyfin-${GITHUB_REF_NAME}.manifest.json" jellyfin-repo/manifest.json
          cd jellyfin-repo
          git init
          git checkout -b jellyfin-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -m "Publish Jellyfin repository for ${GITHUB_REF_NAME}"
          git push --force origin jellyfin-repo
