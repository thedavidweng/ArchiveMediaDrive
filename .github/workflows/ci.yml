name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m json.tool contracts/source.schema.json >/dev/null
      - run: python -m json.tool contracts/raw-node.schema.json >/dev/null
      - run: python -m json.tool contracts/runtime-request.schema.json >/dev/null
      - run: python -m json.tool runtime/rclone/manifest.json >/dev/null
      - run: python -m json.tool contracts/fixtures/sources.json >/dev/null
      - run: python -m json.tool contracts/fixtures/ia/manifest.json >/dev/null
      - name: Reject publishable runtime placeholders
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]] && grep -R "REPLACE_FROM_OFFICIAL_SHA256SUMS" runtime/rclone/manifest.json; then
            exit 1
          fi
      - name: Reject binaries in Kodi plugin
        run: |
          ! find plugins/kodi -type f -not -path '*/__pycache__/*' \( -name '*.so' -o -name '*.dll' -o -name '*.exe' -o -name '*.pyo' -o -name '*.pyc' \) | grep .

  reference-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/reference-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  kodi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/kodi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  kodi-vendor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/kodi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_vendor.py
      - run: python test_vendor_smoke.py

  kodi-addon-checker:
    runs-on: ubuntu-latest
    needs: [kodi, kodi-vendor]
    defaults:
      run:
        working-directory: plugins/kodi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_vendor.py
      - run: python package_release.py
      - run: python -m pip install kodi-addon-checker
      - run: kodi-addon-checker --skip-dependency-checks plugin.video.archivemediadrive
      - run: kodi-addon-checker --skip-dependency-checks repository.archivemediadrive

  dotnet-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test shared/dotnet/ArchiveMediaDrive.Core.Tests/ArchiveMediaDrive.Core.Tests.csproj --configuration Release

  dotnet-jellyfin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test plugins/jellyfin/ArchiveMediaDrive.Jellyfin.Tests/ArchiveMediaDrive.Jellyfin.Tests.csproj --configuration Release

  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build plugins/emby/ArchiveMediaDrive.Emby/ArchiveMediaDrive.Emby.csproj --configuration Release

  rclone-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash
      - run: dotnet test shared/dotnet/ArchiveMediaDrive.Core.Tests/ArchiveMediaDrive.Core.Tests.csproj --configuration Release --filter "Category=Integration"

  release-artifacts:
    runs-on: ubuntu-latest
    needs: [contracts, kodi, kodi-vendor, dotnet-core, dotnet-jellyfin, dotnet-build, rclone-integration]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Kodi plugin ZIP
        working-directory: plugins/kodi
        run: |
          python build_vendor.py
          python package_release.py ../../plugin.video.archivemediadrive-$GITHUB_REF_NAME.zip
          cp repo/repository.archivemediadrive/repository.archivemediadrive-*.zip ../../
          cp repo/addons.xml ../../
          cp repo/addons.xml.md5 ../../

      - name: Build Jellyfin plugin ZIP
        run: |
          dotnet publish plugins/jellyfin/ArchiveMediaDrive.Jellyfin/ArchiveMediaDrive.Jellyfin.csproj \
            -c Release -o ./artifacts/jellyfin
          mkdir -p ./artifacts/jellyfin/runtime/rclone
          cp runtime/rclone/manifest.json ./artifacts/jellyfin/runtime/rclone/manifest.json
          rm -f artifacts/jellyfin/*.pdb artifacts/jellyfin/*.xml
          rm -f artifacts/jellyfin/ArchiveMediaDrive.Jellyfin.deps.json
          rm -f artifacts/jellyfin/ArchiveMediaDrive.Jellyfin.runtimeconfig.json
          rm -f artifacts/jellyfin/web.config
          cd artifacts/jellyfin
          zip -r ../../ArchiveMediaDrive.Jellyfin-$GITHUB_REF_NAME.zip .

      - name: Build Emby plugin ZIP
        run: |
          dotnet publish plugins/emby/ArchiveMediaDrive.Emby/ArchiveMediaDrive.Emby.csproj \
            -c Release -o ./artifacts/emby
          mkdir -p ./artifacts/emby/runtime/rclone
          cp runtime/rclone/manifest.json ./artifacts/emby/runtime/rclone/manifest.json
          rm -f artifacts/emby/*.pdb artifacts/emby/*.xml
          rm -f artifacts/emby/ArchiveMediaDrive.Emby.deps.json
          cd artifacts/emby
          zip -r ../../ArchiveMediaDrive.Emby-$GITHUB_REF_NAME.zip .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: |
            *.zip
            *.xml
            *.md5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.xml
            *.md5
          generate_release_notes: true

