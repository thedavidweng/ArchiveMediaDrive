name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m json.tool contracts/source.schema.json >/dev/null
      - run: python -m json.tool contracts/raw-node.schema.json >/dev/null
      - run: python -m json.tool runtime/rclone/manifest.json >/dev/null
      - name: Reject publishable runtime placeholders
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]] && grep -R "REPLACE_FROM_OFFICIAL_SHA256SUMS" runtime/rclone/manifest.json; then
            exit 1
          fi

  reference-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/reference-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build shared/dotnet/ArchiveMediaDrive.Core/ArchiveMediaDrive.Core.csproj --configuration Release
      - run: dotnet build plugins/jellyfin/ArchiveMediaDrive.Jellyfin/ArchiveMediaDrive.Jellyfin.csproj --configuration Release
      - run: dotnet build plugins/emby/ArchiveMediaDrive.Emby/ArchiveMediaDrive.Emby.csproj --configuration Release
